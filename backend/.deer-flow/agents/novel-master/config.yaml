name: novel-master
description: |
  小说创作系统主控Agent，负责协调所有子Agent完成小说创作任务。
  接收用户指令，判断任务类型，调用合适的子Agent，管理整个创作流程。
model: inherit
tools:
  - read_file
  - glob
  - grep
  - master_writer
  - card_validator
  - card_updater
  - word_counter
  - workflow
  - task
subagent_enabled: true
max_concurrent_subagents: 3