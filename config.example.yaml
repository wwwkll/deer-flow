# ============================================================================
# ⑤ Workflows Configuration (工作流配置)
# ============================================================================
# 工作流是确定性的任务编排，不依赖 LLM 决策，保证流程完整执行。
# 主 Agent 通过 workflow 工具调用工作流。
#
# 内置工作流：
#   - organize: 整理工作流（步骤1-4，包含并行整理）
#   - writing:  写作工作流（写作-审核-后处理，最多审核2次）
#
# 工作流不是 Agent，也不是 Skill：
#   - Agent: 独立 LLM 会话，LLM 自主决策
#   - Skill: 提示词模板，自动注入上下文
#   - Workflow: 确定性编排，代码预定义，无 LLM 决策
#
# 工作流内部通过 call_subagent() 调用子 Agent，使用 custom_agents 中的配置。
# 子 Agent 的 system_prompt 支持 {{xxx}} 全局变量替换。
#
# 审核判断机制：
#   工作流要求 continuity-auditor 在报告末尾输出结构化标记：
#   - [AUDIT_RESULT: PASS] 审核通过
#   - [AUDIT_RESULT: FAIL] 审核不通过
#   脚本解析标记，不依赖关键词匹配。
#
# 使用示例（在 SOUL.md 中）：
#   调用 workflow 工具：
#   - workflow_name: "organize"
#   - params: {"novel_name": "xxx", "chapter_num": 6, "chapter_group": "06-10"}
#   - description: "整理第6章参考信息"
#
# 工作流文件位置：
#   backend/packages/harness/deerflow/workflows/
#   ├── __init__.py
#   ├── states.py           状态类型定义
#   ├── registry.py         工作流注册表
#   ├── executor.py         工作流执行引擎
#   ├── helpers.py          辅助函数（调用子Agent）
#   ├── novel_organize.py   整理工作流
#   └── novel_writing.py    写作工作流
# ============================================================================
