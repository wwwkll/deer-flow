# Configuration for the DeerFlow application
config_version: 9

# ============================================================================
# Logging Configuration
# ============================================================================
log_level: info

token_usage:
  enabled: false

# ============================================================================
# Models Configuration
# ============================================================================
# Define one or more LLM models for the agent to use
# Agent configs can override by name (e.g. model: o4-mini)

models:
  # Primary model configuration
  - name: qwen-3-6-online
    display_name: Qwen 3.6 Online
    use: langchain_openai:ChatOpenAI
    model: qwen-3-6-online
    # Authentication: API key or username:password format
    api_key: $OPENAI_API_KEY
    # Base URL for the model endpoint
    base_url: https://your-model-api-endpoint/v1
    # Request timeout in seconds
    request_timeout: 60000.0
    # Maximum number of retries for failed requests
    max_retries: 4
    # Maximum number of tokens in the model's response
    max_tokens: 80000
    # Temperature for controlling response randomness
    temperature: 0.7
    # Whether the model supports thinking mode
    supports_thinking: false
    # Whether the model supports vision
    supports_vision: false

  # Xiaomi MiMo model configuration
  # 重要：MiMo API 的 thinking 模式要求 reasoning_content 必须回传，
  # 必须使用 PatchedMiMoChatOpenAI 而非原生 ChatOpenAI
  # - name: mimo-v2.5
  #   display_name: mimo-v2.5
  #   use: deerflow.models.patched_mimo:PatchedMiMoChatOpenAI
  #   model: mimo-v2.5
  #   api_key: $MIMO_API_KEY
  #   base_url: https://token-plan-cn.xiaomimimo.com/v1
  #   request_timeout: 60000.0
  #   max_retries: 4
  #   max_tokens: 80000
  #   temperature: 1
  #   supports_thinking: false
  #   supports_vision: false

  # Local model configuration (e.g. LM Studio, Ollama)
  # 使用本地模型时建议降低 temperature、减少 max_retries、添加重复惩罚
  #
  # ⚠️ 重要：如果模型支持思考模式（如 Qwen-32B/72B-Thinking、DeepSeek-R1 等），
  #   必须使用 GenericPatchedChatOpenAI 才能捕获和显示思考内容！
  #   原生 langchain_openai:ChatOpenAI 会静默丢弃 reasoning_content。
  #
  # 支持思考的本地模型配置示例（推荐）：
  # - name: qwen-thinking-local
  #   display_name: Qwen 32B Thinking (Local)
  #   use: deerflow.models.patched_generic_openai:GenericPatchedChatOpenAI
  #   model: qwen3:32b
  #   api_key: ollama               # Ollama 不需要真实 API Key，填任意值即可
  #   base_url: http://localhost:11434/v1
  #   request_timeout: 60000.0
  #   max_retries: 1
  #   max_tokens: 80000
  #   temperature: 0.5
  #   supports_thinking: true       # 启用思考模式后前端可显示 <思考> 内容
  #   supports_vision: false
  #   model_kwargs:
  #     extra_body:
  #       repetition_penalty: 1.2
  #       top_p: 0.9
  #
  # 不支持思考的普通本地模型配置：
  - name: local-model
    display_name: Local Model
    use: langchain_openai:ChatOpenAI
    model: local-model-name
    api_key: sk-key
    base_url: http://localhost:1234/v1
    request_timeout: 60000.0
    max_retries: 1           # 本地模型建议减少重试次数（避免无限重试）
    max_tokens: 80000        # 设置最大输出token数，防止无限生成（关键参数！）
    temperature: 0.5         # 本地模型建议降低温度（0.5-0.6），减少随机性
    supports_thinking: false
    supports_vision: false
    model_kwargs:
      extra_body:
        repetition_penalty: 1.2  # 重复惩罚，防止循环输出（推荐 1.15-1.3）
        top_p: 0.9               # 限制采样范围
        presence_penalty: 0.1    # 话题新鲜度惩罚，鼓励生成新内容
        frequency_penalty: 0.2   # 词频惩罚，减少重复词汇使用

  # ============================================================================
  # 模型适配器说明（use 字段可选值）
  # ============================================================================
  #
  # | 适配器 | 用途 | 是否捕获 reasoning_content |
  # |--------|------|--------------------------|
  # | langchain_openai:ChatOpenAI | 标准 OpenAI 兼容 API | ❌ 丢弃 |
  # | deerflow.models.patched_generic_openai:GenericPatchedChatOpenAI | **通用** OpenAI 兼容（Ollama/LM Studio/本地模型） | ✅ 推荐 |
  # | deerflow.models.patched_mimo:PatchedMiMoChatOpenAI | 小米 MiMo | ✅ |
  # | deerflow.models.vllm_provider:VllmChatModel | vLLM 部署 | ✅ |
  # | deerflow.models.patched_deepseek:PatchedChatDeepSeek | DeepSeek | ✅ |
  # | deerflow.models.patched_openai:PatchedChatOpenAI | Gemini (via gateway) | ❌ 仅 thought_signature |
  # | deerflow.models.patched_minimax:PatchedChatMiniMax | MiniMax | ✅ |
  # | deerflow.models.claude_provider:ClaudeChatModel | Anthropic Claude | ✅ 原生支持 |
  # | deerflow.models.mindie_provider:MindIEChatModel | 华为 MindIE | ✅ |
  #

# ============================================================================
# Tool Groups Configuration
# ============================================================================
# Define groups of tools for organization and access control

tool_groups:
  - name: web
  - name: file:read
  - name: file:write
  - name: bash
  - name: novel:tools
  - name: master:write
  - name: novel:reader

# ============================================================================
# Tools Configuration
# ============================================================================
# Configure available tools for the agent to use

tools:
  # Web search tool (uses DuckDuckGo, no API key required)
  - name: web_search
    group: web
    use: deerflow.community.ddg_search.tools:web_search_tool
    max_results: 5

  # Web search tool (requires Tavily API key)
  # - name: web_search
  #   group: web
  #   use: deerflow.community.tavily.tools:web_search_tool
  #   max_results: 5
  #   # api_key: $TAVILY_API_KEY  # Set if needed

  # Web search tool (uses InfoQuest, requires InfoQuest API key)
  # - name: web_search
  #   group: web
  #   use: deerflow.community.infoquest.tools:web_search_tool
  #   search_time_range: 10

  # Web search tool (uses Exa, requires EXA_API_KEY)
  # - name: web_search
  #   group: web
  #   use: deerflow.community.exa.tools:web_search_tool
  #   max_results: 5
  #   search_type: auto
  #   contents_max_characters: 1000

  # Web search tool (uses Firecrawl, requires FIRECRAWL_API_KEY)
  # - name: web_search
  #   group: web
  #   use: deerflow.community.firecrawl.tools:web_search_tool
  #   max_results: 5

  # Web fetch tool (uses Exa)
  # NOTE: Only one web_fetch provider can be active at a time.
  # - name: web_fetch
  #   group: web
  #   use: deerflow.community.exa.tools:web_fetch_tool

  # Web fetch tool (uses Jina AI reader)
  - name: web_fetch
    group: web
    use: deerflow.community.jina_ai.tools:web_fetch_tool
    timeout: 10

  # Web fetch tool (uses InfoQuest)
  # - name: web_fetch
  #   group: web
  #   use: deerflow.community.infoquest.tools:web_fetch_tool
  #   timeout: 10
  #   fetch_time: 10
  #   navigation_timeout: 30

  # Web fetch tool (uses Firecrawl, requires FIRECRAWL_API_KEY)
  # - name: web_fetch
  #   group: web
  #   use: deerflow.community.firecrawl.tools:web_fetch_tool

  # Image search tool (uses DuckDuckGo)
  - name: image_search
    group: web
    use: deerflow.community.image_search.tools:image_search_tool
    max_results: 5

  # Image search tool (uses InfoQuest)
  # - name: image_search
  #   group: web
  #   use: deerflow.community.infoquest.tools:image_search_tool
  #   image_search_time_range: 10
  #   image_size: "i"

  # File operations tools
  - name: ls
    group: file:read
    use: deerflow.sandbox.tools:ls_tool

  - name: read_file
    group: file:read
    use: deerflow.sandbox.tools:read_file_tool

  - name: glob
    group: file:read
    use: deerflow.sandbox.tools:glob_tool
    max_results: 200

  - name: grep
    group: file:read
    use: deerflow.sandbox.tools:grep_tool
    max_results: 100

  - name: write_file
    group: file:write
    use: deerflow.sandbox.tools:write_file_tool

  - name: str_replace
    group: file:write
    use: deerflow.sandbox.tools:str_replace_tool

  # Bash execution tool
  - name: bash
    group: bash
    use: deerflow.sandbox.tools:bash_tool

  # Novel Tools (小说写作辅助工具)
  - name: context_assembler
    group: novel:tools
    use: my_tools.context_assembler:context_assembler

  - name: post_write_validator
    group: novel:tools
    use: my_tools.post_write_validator:post_write_validator

  - name: ai_trace_detector
    group: novel:tools
    use: my_tools.ai_trace_detector:ai_trace_detector

  - name: card_validator
    group: novel:tools
    use: my_tools.card_validator:card_validator

  - name: card_updater
    group: novel:tools
    use: my_tools.card_updater:card_updater

  # Novel Master Writer Tool (restricted whitelist)
  # 只允许创建目录和写入 03-状态 目录下的文件
  - name: master_writer
    group: master:write
    use: my_tools.master_writer:master_writer

  # Novel Reader Tool (restricted whitelist)
  # 只允许读取 _task/、05-参考/、02-正文/ 目录下的文件
  - name: writer_reader
    group: novel:reader
    use: my_tools.writer_reader:writer_reader

# ============================================================================
# Tool Search Configuration (Deferred Tool Loading)
# ============================================================================

tool_search:
  enabled: false

# ============================================================================
# Sandbox Configuration
# ============================================================================

uploads:
  auto_convert_documents: false
  pdf_converter: auto

sandbox:
  use: deerflow.sandbox.local:LocalSandboxProvider
  allow_host_bash: false
  mounts:
    # 共享目录配置
    # 重要：host_path 必须配置在项目目录之外（如 E:\xiangmu\deer-flow-data\shared-data）
    # 否则 Agent 在共享目录中创建/修改文件时，会触发 uvicorn --reload 机制导致服务重启
    # 支持绝对路径或相对于项目根目录的相对路径
    - host_path: E:\xiangmu\deer-flow-data\shared-data
      container_path: /mnt/shared-data
      read_only: false
  bash_output_max_chars: 20000
  read_file_output_max_chars: 50000
  ls_output_max_chars: 20000

# ============================================================================
# Skills Configuration
# ============================================================================

skills:
  path: skills
  container_path: /mnt/skills

# ============================================================================
# Title Generation Configuration
# ============================================================================

title:
  enabled: true
  max_words: 6
  max_chars: 60
  model_name: null

# ============================================================================
# Summarization Configuration
# ============================================================================

summarization:
  # 是否启用对话历史自动总结（当对话 token 数接近上下文窗口上限时自动压缩旧消息）
  enabled: true
  # 总结使用的模型，null 表示使用默认模型（推荐用轻量模型，节约成本）
  model_name: null
  trigger:
    # fraction: 上下文窗口百分比触发（推荐本地模型使用，自动适配不同上下文大小）
    #   value: 0.85 表示对话 token 数达到上下文窗口的 85% 时触发总结
    #   上下文窗口自动从 LM Studio / Ollama 的 /models 接口读取（context_length）
    #   也可在模型配置中手动指定 context_window 字段
    # tokens: 绝对 token 数触发（适合云端模型，需手动指定具体数值）
    # messages: 消息数量触发
    - type: fraction
      value: 0.85
  keep:
    type: messages
    value: 10           # 总结后保留最近 N 条消息（不被压缩）
  trim_tokens_to_summarize:
    # 总结时裁剪待压缩消息的 token 上限，fraction 表示占上下文窗口的百分比
    type: fraction
    value: 0.85
  summary_prompt: null    # 自定义总结提示词，null 使用默认
  preserve_recent_skill_count: 5
  preserve_recent_skill_tokens: 25000
  preserve_recent_skill_tokens_per_skill: 5000
  skill_file_read_tool_names:
    - read_file
    - read
    - view
    - cat

# ============================================================================
# Memory Configuration
# ============================================================================

memory:
  enabled: false
  storage_path: memory.json
  debounce_seconds: 30
  model_name: null
  max_facts: 100
  fact_confidence_threshold: 0.7
  injection_enabled: false
  max_injection_tokens: 2000

# ============================================================================
# Agents API Configuration
# ============================================================================

agents_api:
  enabled: true

# ============================================================================
# Skill Evolution Configuration
# ============================================================================

skill_evolution:
  enabled: false
  moderation_model_name: null

# ============================================================================
# Subagents Configuration
# ============================================================================

subagents:
  timeout_seconds: 900
  # 使用本地模型时建议降低 max_turns，防止无限循环
  max_turns: 30
  # 工作流并行执行开关
  # true:  并行执行（适合线上模型，支持并发请求）
  # false: 串行执行（适合本地模型，避免并发导致的问题）
  workflow_parallel_enabled: true

  agents:
    # 小说架构师（规划工作流调用，负责小说整体架构设计）
    novel-architect:
      timeout_seconds: 1800
      max_turns: 80
    # 小说写手（写作工作流调用，负责正文撰写）
    novel-writer:
      timeout_seconds: 1800
      max_turns: 80
    # 小说修订师（写作工作流调用，负责内容修订）
    novel-reviser:
      timeout_seconds: 1800
      max_turns: 80
    # 连续性审核员（写作工作流调用，检查剧情连贯性）
    continuity-auditor:
      timeout_seconds: 1200
      max_turns: 60
    general-purpose:
      timeout_seconds: 1800
      max_turns: 160
    bash:
      timeout_seconds: 300
      max_turns: 80
    # 世界观更新员（写作工作流调用，根据正文更新世界观文件）
    world-updater:
      timeout_seconds: 600
      max_turns: 60
    # 细纲审核师（规划工作流调用，审核细纲质量）
    outline-auditor:
      timeout_seconds: 600
      max_turns: 40
    # 细纲修改师（规划工作流调用，根据审核报告修改细纲）
    outline-reviser:
      timeout_seconds: 600
      max_turns: 40
    # 细纲摘要维护师（规划工作流调用，更新细纲摘要文档）
    outline-summarizer:
      timeout_seconds: 300
      max_turns: 30

checkpointer:
  type: sqlite
  connection_string: checkpoints.db

# ============================================================================
# LLM Streaming Loop Guard Configuration
# ============================================================================
# 检测 LLM 流式输出中的死循环并自动终止（针对本地小模型如 Qwen-1.8B/4B、Yi-Lite 等）
# 两层检测：Layer A 抓完全重复（"好的好的好的..."）、Layer B 抓模板变体（"今天是周一，明天是周二..."）
# 默认开启，无需修改即可使用。如需关闭：loop_guard: { enabled: false }

loop_guard:
  enabled: true
  # 滚动窗口字符数（分析最近 N 个字符）
  max_tail_chars: 2000
  # 每 N 个新字符运行一次检测（越小检测越早，CPU 开销越大）
  check_interval_chars: 60
  # 累计 N 字符之前不检测（避免短回复误判）
  min_content_length: 200
  # Layer A: 后缀 n-gram 检测长度（6=短语，12=短句，24=半句，48=整段）
  ngram_sizes: [6, 12, 24, 48]
  # Layer A: 后缀重复几次判定循环（30=宽松，减少正常列表/排比句误判）
  max_ngram_repeats: 30
  # Layer B: 检查最近 N 个子句（32=覆盖约3个旋转周期，能抓4块模板循环）
  clause_window: 32
  # Layer B: 多少个相似子句判定循环
  max_clause_repeats: 4
  # Layer B: Dice 相似度阈值（0.5=保守，0.6=更严格）
  clause_similarity_threshold: 0.5
  # Layer B: 子句最短长度（忽略过短片段）
  clause_min_length: 3
  # Layer B: 子句最长长度（忽略过长散文）
  clause_max_length: 80

# ============================================================================
# Global Variables Database Configuration
# ============================================================================
# 全局变量数据库配置，支持 SQLite（默认）和 PostgreSQL 两种后端
# 
# SQLite：零配置，适合单用户开发环境
# PostgreSQL：高并发支持，适合多 Agent 同时写入的场景
#
# 如需使用 PostgreSQL，请先安装依赖：
#   uv add psycopg[binary] psycopg-pool
#
global_variables:
  # 数据库类型：sqlite | postgres
  db_type: sqlite
  # 连接字符串（SQLite 默认留空即可，使用 {DEER_FLOW_HOME}/global_variables.db）
  # PostgreSQL 示例：postgresql://postgres:yuhan1014@localhost:5432/deerflow
  connection_string: null
