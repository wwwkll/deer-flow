# Configuration for the DeerFlow application
config_version: 8

# ============================================================================
# Logging Configuration
# ============================================================================
log_level: info

token_usage:
  enabled: false

# ============================================================================
# Models Configuration
# ============================================================================
# Define one or more LLM models for the agent to use
# Agent configs can override by name (e.g. model: o4-mini)

models:
  # Primary model configuration
  - name: qwen-3-6-online
    display_name: Qwen 3.6 Online
    use: langchain_openai:ChatOpenAI
    model: qwen-3-6-online
    # Authentication: API key or username:password format
    api_key: $OPENAI_API_KEY
    # Base URL for the model endpoint
    base_url: https://your-model-api-endpoint/v1
    # Request timeout in seconds
    request_timeout: 60000.0
    # Maximum number of retries for failed requests
    max_retries: 4
    # Maximum number of tokens in the model's response
    max_tokens: 80000
    # Temperature for controlling response randomness
    temperature: 0.7
    # Whether the model supports thinking mode
    supports_thinking: false
    # Whether the model supports vision
    supports_vision: false

# ============================================================================
# Tool Groups Configuration
# ============================================================================
# Define groups of tools for organization and access control

tool_groups:
  - name: web
  - name: file:read
  - name: file:write
  - name: bash

# ============================================================================
# Tools Configuration
# ============================================================================
# Configure available tools for the agent to use

tools:
  # Web search tool (uses DuckDuckGo, no API key required)
  - name: web_search
    group: web
    use: deerflow.community.ddg_search.tools:web_search_tool
    max_results: 5

  # Web search tool (requires Tavily API key)
  # - name: web_search
  #   group: web
  #   use: deerflow.community.tavily.tools:web_search_tool
  #   max_results: 5
  #   # api_key: $TAVILY_API_KEY  # Set if needed

  # Web search tool (uses InfoQuest, requires InfoQuest API key)
  # - name: web_search
  #   group: web
  #   use: deerflow.community.infoquest.tools:web_search_tool
  #   search_time_range: 10

  # Web search tool (uses Exa, requires EXA_API_KEY)
  # - name: web_search
  #   group: web
  #   use: deerflow.community.exa.tools:web_search_tool
  #   max_results: 5
  #   search_type: auto
  #   contents_max_characters: 1000

  # Web search tool (uses Firecrawl, requires FIRECRAWL_API_KEY)
  # - name: web_search
  #   group: web
  #   use: deerflow.community.firecrawl.tools:web_search_tool
  #   max_results: 5

  # Web fetch tool (uses Exa)
  # NOTE: Only one web_fetch provider can be active at a time.
  # - name: web_fetch
  #   group: web
  #   use: deerflow.community.exa.tools:web_fetch_tool

  # Web fetch tool (uses Jina AI reader)
  - name: web_fetch
    group: web
    use: deerflow.community.jina_ai.tools:web_fetch_tool
    timeout: 10

  # Web fetch tool (uses InfoQuest)
  # - name: web_fetch
  #   group: web
  #   use: deerflow.community.infoquest.tools:web_fetch_tool
  #   timeout: 10
  #   fetch_time: 10
  #   navigation_timeout: 30

  # Web fetch tool (uses Firecrawl, requires FIRECRAWL_API_KEY)
  # - name: web_fetch
  #   group: web
  #   use: deerflow.community.firecrawl.tools:web_fetch_tool

  # Image search tool (uses DuckDuckGo)
  - name: image_search
    group: web
    use: deerflow.community.image_search.tools:image_search_tool
    max_results: 5

  # Image search tool (uses InfoQuest)
  # - name: image_search
  #   group: web
  #   use: deerflow.community.infoquest.tools:image_search_tool
  #   image_search_time_range: 10
  #   image_size: "i"

  # File operations tools
  - name: ls
    group: file:read
    use: deerflow.sandbox.tools:ls_tool

  - name: read_file
    group: file:read
    use: deerflow.sandbox.tools:read_file_tool

  - name: glob
    group: file:read
    use: deerflow.sandbox.tools:glob_tool
    max_results: 200

  - name: grep
    group: file:read
    use: deerflow.sandbox.tools:grep_tool
    max_results: 100

  - name: write_file
    group: file:write
    use: deerflow.sandbox.tools:write_file_tool

  - name: str_replace
    group: file:write
    use: deerflow.sandbox.tools:str_replace_tool

  # Bash execution tool
  - name: bash
    group: bash
    use: deerflow.sandbox.tools:bash_tool

# ============================================================================
# Tool Search Configuration (Deferred Tool Loading)
# ============================================================================

tool_search:
  enabled: false

# ============================================================================
# Sandbox Configuration
# ============================================================================

uploads:
  auto_convert_documents: false
  pdf_converter: auto

sandbox:
  use: deerflow.sandbox.local:LocalSandboxProvider
  allow_host_bash: false
  mounts:
    - host_path: backend/.deer-flow/shared-data
      container_path: /mnt/shared-data
      read_only: false
  bash_output_max_chars: 20000
  read_file_output_max_chars: 50000
  ls_output_max_chars: 20000

# ============================================================================
# Skills Configuration
# ============================================================================

skills:
  path: skills
  container_path: /mnt/skills

# ============================================================================
# Title Generation Configuration
# ============================================================================

title:
  enabled: true
  max_words: 6
  max_chars: 60
  model_name: null

# ============================================================================
# Summarization Configuration
# ============================================================================

summarization:
  enabled: true
  model_name: null
  trigger:
    - type: tokens
      value: 75000
  keep:
    type: messages
    value: 20
  trim_tokens_to_summarize:
    type: fraction
    value: 0.9375  # 93.75% of model max_tokens, auto-adjusts per model
  summary_prompt: null
  preserve_recent_skill_count: 5
  preserve_recent_skill_tokens: 25000
  preserve_recent_skill_tokens_per_skill: 5000
  skill_file_read_tool_names:
    - read_file
    - read
    - view
    - cat

# ============================================================================
# Memory Configuration
# ============================================================================

memory:
  enabled: false
  storage_path: memory.json
  debounce_seconds: 30
  model_name: null
  max_facts: 100
  fact_confidence_threshold: 0.7
  injection_enabled: false
  max_injection_tokens: 2000

# ============================================================================
# Agents API Configuration
# ============================================================================

agents_api:
  enabled: true

# ============================================================================
# Skill Evolution Configuration
# ============================================================================

skill_evolution:
  enabled: false
  moderation_model_name: null

# ============================================================================
# Subagents Configuration
# ============================================================================

subagents:
  timeout_seconds: 900
  max_turns: 50

  agents:
    general-purpose:
      timeout_seconds: 1800
      max_turns: 160
    bash:
      timeout_seconds: 300
      max_turns: 80

checkpointer:
  type: sqlite
  connection_string: checkpoints.db

